# Builds UltraEnhancePro_Setup.exe and the portable ZIP on GitHub's free Windows runners.
# Push this project to a GitHub repo, open the Actions tab, run "Build Windows installer",
# then download the "UltraEnhancePro-windows" artifact. No local Python needed.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start-up smoke test
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python tools/startup_check.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: UltraEnhancePro-windows
          path: |
            dist/UltraEnhancePro_Setup.exe
            dist/UltraEnhancePro_Portable.zip
          if-no-files-found: error
